name: 功能建议
description: 提出一个新功能或改进
title: "[feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪里，为什么需要它
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
