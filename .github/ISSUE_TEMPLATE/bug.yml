name: Bug 报告
description: 报告一个可复现的问题
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 插件版本与 DSH 版本
      placeholder: dsh-blog 0.1.0 / DSH 0.2.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
